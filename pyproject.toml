[project]
name = "agente-consultas"
version = "0.1.0"
description = "AI-powered data analysis agent for coffee production/sales data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.2.10",
    "langchain-experimental>=0.4.1",
    "langchain-openai>=1.1.9",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydantic>=2.11.7",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.1.1",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
]

[project.scripts]
agente-consultas = "agente_consultas.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente_consultas"]
